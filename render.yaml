services:
  - type: web
    name: analisi-portafoglio
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application -c gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Storage persistente su Cloudflare R2 (o altro S3-compatibile).
      # I valori si inseriscono nel dashboard Render (Environment).
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
